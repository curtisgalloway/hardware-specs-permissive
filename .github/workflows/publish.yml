# SPDX-License-Identifier: Apache-2.0
#
# Builds the Markdown view and the viewer of every spec under specs/ (driver-lab design D5) with
# driver-lab's skills/spec-format/ci/publish.py, from the template in skills/spec-format/ci/.
# Pull requests: build and upload the views as the spec-views artifact, under the pr
# verification policy. Main pushes and the weekly run: build under the main policy, then the
# deploy job re-renders and verifies every page and deploys the site to GitHub Pages. The deploy
# job never runs on pull requests, and only it has write permissions. Nothing generated is
# committed.
#
# The deploy job needs GitHub Pages enabled with GitHub Actions as its source. Until then the
# build job still passes on main, and the deploy job fails at its Deploy step.
#
# Context roots, read so that this repository's overlays and root-qualified references resolve
# and so that each overlaid spec also gets a merged page:
#   hardware-specs-docs/specs
name: Publish spec views
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
env:
  # driver-lab's commit: the same pin as checks.yml's driver-lab checkout; bump both together.
  TOOL_COMMIT: 'b86af09353111af1cccb6c529dc6cf6cad1726d0'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs_commit: ${{ steps.context.outputs.docs_commit }}
    steps:
      - name: Require an installed tool revision
        run: test "$TOOL_COMMIT" != 0000000000000000000000000000000000000000
      # This repository, beside (never containing) the context checkouts; its spec root is
      # repo/specs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curtisgalloway/hardware-specs-docs
          ref: main
          path: ctx-docs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curtisgalloway/driver-lab
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      # The context repositories are read at their main branches, as checks.yml reads them (spec
      # data only, no code that runs here). Their commits are recorded so that the deploy job
      # re-renders from exactly the same sources and every page's banner names them.
      - name: Record context commits
        id: context
        run: |
          echo "docs_commit=$(git -C ctx-docs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned renderer
        run: |
          python -m venv "$RUNNER_TEMP/spec-venv"
          "$RUNNER_TEMP/spec-venv/bin/pip" install --require-hashes -r tooling/skills/spec-format/requirements.txt
      - name: Build both views and repeat containment checks
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERIFY_POLICY: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          DOCS_COMMIT: ${{ steps.context.outputs.docs_commit }}
        run: |
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py build repo/specs --context-root ctx-docs/specs --source-commit "ctx-docs/specs=$DOCS_COMMIT" --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY"
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py verify repo/specs --context-root ctx-docs/specs --source-commit "ctx-docs/specs=$DOCS_COMMIT" --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified "$VERIFY_POLICY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec-views
          path: site
          if-no-files-found: error
  deploy:
    if: github.repository == 'curtisgalloway/hardware-specs-permissive' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: spec-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curtisgalloway/hardware-specs-docs
          ref: ${{ needs.build.outputs.docs_commit }}
          path: ctx-docs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curtisgalloway/driver-lab
          ref: ${{ env.TOOL_COMMIT }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned renderer
        run: |
          python -m venv "$RUNNER_TEMP/spec-venv"
          "$RUNNER_TEMP/spec-venv/bin/pip" install --require-hashes -r tooling/skills/spec-format/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spec-views
          path: site
      - name: Refuse incomplete or altered site before deploying
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          DOCS_COMMIT: ${{ needs.build.outputs.docs_commit }}
        run: |
          "$RUNNER_TEMP/spec-venv/bin/python" tooling/skills/spec-format/ci/publish.py verify repo/specs --context-root ctx-docs/specs --source-commit "ctx-docs/specs=$DOCS_COMMIT" --out site --source-commit "repo/specs=$SOURCE_COMMIT" --tool-commit "$TOOL_COMMIT" --require-verified main
      # Prepare the Pages tar locally: upload-pages-artifact nests a mutable
      # upload-artifact@v4 even when the composite itself is pinned by SHA.
      - name: Archive verified Pages site
        run: |
          tar --dereference --hard-dereference --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
