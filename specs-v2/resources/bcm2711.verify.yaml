  secondary-core-release-spin-table:
    basis: 904a1290c9c02f89f75db36bb721eaa8e2db9e75f833f7ffaf30ab0694e1ffde
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 6edd40f against the cca4556 record,
      which was itself a delta verification of cca4556 against the 7661ab8 record; second reader run
      separately)
    note: 'MPIDR bits 1:0 select the path

      (151-153); secondaries `wfe` and load the 64-bit word at `spin_cpu0` + 8 × core until

      non-zero, then zero x0 and join `boot_kernel`, which zeroes x1–x3 and branches (155-161,

      167-171); the slots are at 0xD8, 0xE0, 0xE8, 0xF0 (175-189), and core 0 never polls 0xD8. The

      hardware-location sentence carries a document class: the TF-A page says the firmware loads a

      stub file (`armstub8.bin` or `armstub=`) to the start of DRAM, address 0; the Makefile at the

      pin also links the AArch64 stubs at 0. For the built-in stub this rests on the first bullet''s

      build-identity step, which the overlay''s preamble already states.'
    carried_from:
      repo: hardware-specs-permissive
      commit: 249412ebf790b62da37a6134b98aaf0cb487fb96
      path: specs/resources/bcm2711.verify.md
      key: 'Quick-facts/8 "Secondary-core release: spin-table"'
      format: 1
  gic-programming-at-el3:
    basis: 7d12a0c4669936aadd890d5b3c06d5995f3ecc14dd728a2c55018730dfd8f132
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 6edd40f against the cca4556 record,
      which was itself a delta verification of cca4556 against the 7661ab8 record; second reader run
      separately)
    note: 'the register offsets and `IT_NR` = 8 (85-89);

      `setup_gic` is called before the `eret` under `GIC` (133-135); in `setup_gic` (214-235) a core

      with non-zero MPIDR bits 1:0 writes 3 to `GICD_CTLR`, core 0 branches past it under a "primary

      core" comment, and every core writes 0x1E7 to `GICC_CTLR`, 0xFF to `GICC_PMR`, and all-ones
      to

      eight words from `GICD_IGROUPR` downward (IDs 0–255). Non-`HIGH_PERI` `GIC_DISTB`/`GIC_CPUB`
      are

      0xFF84_1000/0xFF84_2000 (45-51). "Every core" is supported by the source: secondaries reach
      the

      spin loop only after the `eret`, which follows `setup_gic`.'
    carried_from:
      repo: hardware-specs-permissive
      commit: 249412ebf790b62da37a6134b98aaf0cb487fb96
      path: specs/resources/bcm2711.verify.md
      key: Quick-facts/9 "GIC programming at EL3"
      format: 1
  the-group-settings-the-stub-wrote-are-secure-state:
    basis: 2611b50ae2b0c9b0327954129a20d64f32cefb1f62989c49181ce2ea35d07fb8
    verdict: PASS
    date: '2026-10-08'
    verifier: Claude Opus 5.5, Claude Code subagent (delta of 6edd40f against the cca4556 record,
      which was itself a delta verification of cca4556 against the 7661ab8 record; second reader run
      separately)
    note: 'the retitled lead-in

      now claims only the group settings, which resolves the earlier FAIL (the stub''s `GICC_PMR`

      write is no longer in scope). IHI 0048B §4.3.4 (p. 4-89): with the Security Extensions the

      group registers are Secure-only and RAZ/WI to Non-secure accesses; GIC-400 TRM §1.1 (p. 1-2)

      lists the GIC Security Extensions among its features, and TRM §3.2.1 (p. 3-3) says the same

      of `GICD_IGROUPRn`.'
    carried_from:
