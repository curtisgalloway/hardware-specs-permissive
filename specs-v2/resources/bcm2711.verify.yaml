      separately)
    note: '`SCR_VAL` is RW(10), HCE(8), SMD(7), bits 5 and 4, NS(0)

      (59-66), written to `SCR_EL3` at 121-123. DDI 0487 M.d §D24.2.168: RW on p. D24-9638 (next

      lower level AArch64), HCE and SMD on pp. D24-9639–D24-9640 (HVC enabled; SMC UNDEFINED, with

      the note that an `HCR_EL2.TSC` trap of EL1 SMC takes priority), NS on p. D24-9641; bits 5:4
      are

      RES1 on p. D24-9640. The stated consequences match.'
    carried_from:
