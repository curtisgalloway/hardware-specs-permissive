      SCR_VAL (lines 59-66) is RW|HCE|SMD|RES1 bits 5,4|NS, so bit 7 (SMD) is set and bits 3,2,1 (EA,
      FIQ, IRQ) are clear; SCR_EL3 is written whole at line 123. CPTR_EL3 is written from xzr at 119.
