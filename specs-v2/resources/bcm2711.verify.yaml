      separately)
    note: '`stub_magic` 0x5AFE570B at 0xF0, `stub_version` at 0xF4,

      `dtb_ptr32` at 0xF8, `kernel_entry32` at 0xFC, the last two assembled as zero (193-208) and
      only

      loaded (163-165); the comment at 190-192 says the firmware clears the eight bytes at 0xF0 after

      reading, leaving the slot for core 3. The TF-A page, "TF-A port design", says the GPU firmware,

      on finding a magic value in the stub, writes the kernel and DTB load addresses near the start

      of memory, which supports the firmware sentence.'
