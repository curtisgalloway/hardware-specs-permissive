      anywhere, and no msr after line 148, setup_gic uses mrs/str). Secondaries loop on wfe/ldr/cbz
      at 155-161 and branch only on a non-zero slot. Arm ARM M.d (sha256 matches the declared 80d589a4...):
      SCR_EL3 D24.2.168, pages D24-9639 to D24-9641, gives SMD=1 as SMC UNDEFINED at EL1 and above
      with the HCR_EL2.TSC priority note, and EA/FIQ/IRQ=0 as not taken to EL3 from below EL3; rule
      RHMXQS at D1-7258 agrees. Linux v7.2 arm64 booting.rst, "Call the kernel image": enable methods
      are spin-table (poll cpu-release-addr) or psci. TF-A docs/plat/rpi4.rst, "Build Instructions":
      bl31.bin loaded via armstub= in config.txt, BL31 patches the DTB to advertise PSCI. The armstub8.S
      header is a BSD 3-clause notice, matching the declared BSD-3-Clause. Read versus derived: the
      conclusion is a declared inference with premises, assumptions (stub-build-identity, all-four-cores-enter-the-stub,
