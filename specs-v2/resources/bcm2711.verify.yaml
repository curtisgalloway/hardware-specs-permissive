  interrupt-groups-at-entry:
    basis: c545997e9b3047b9ffab7142f82a2b10ce5b5f07200efcd030c2963905843c4e
    verdict: PASS
    date: '2026-10-09'
    verifier: Claude Code, claude-sonnet-5-5, reader bcm2711-sf2-10b-primary-src
    note: 'Declared inference. Source: armstubs/armstub8.S lines 228-234 write all-ones to offsets
      0..28 from GICD_IGROUPR (0x80), eight words (IT_NR 8, loop stores at 28 down to 0), lines 133-135
      call setup_gic on every core before the eret at 148 and the SCR_EL3.NS write is at 121-123,
      before it; the file never writes SCTLR_EL3 (no hit for SCTLR_EL3, VBAR or MDCR in the whole
      file). Datasheet 6.5.1 page 92: NUM_SPIS=192. gic-400-trm Table 3-2 note d (page 3-5): ITLinesNumber
      is NUM_SPIS/32 and all IDs to (ITLinesNumber+1)*32-1 are implemented except 16-24, so IDs 0-223
      and seven group registers. gicv2-spec 4.3.4 page 4-89: implemented IGROUPR count is ITLinesNumber+1,
      unimplemented bits RAZ/WI, IGROUPR0 banked per processor, Secure-access only. gic-400-trm section
      1.1 page 1-2: Group 1 is the Non-secure group. arm-arm: D1.1.2 rule RZFPTR (page D1-7206, EL3
      is Secure state without FEAT_RME), A2.3 page A2-169 (FEAT_RME is an Armv9 extension), D24.2.176
      SCTLR_EL3 M bit page D24-9765 (resets to 0 when EL3 is the highest implemented level; the text
      states this under Warm reset), D8.2.12.1 rule RPPDBS page D8-7730 (stage 1 disabled, Secure
      state access goes to Secure PA space). All hashes match the declared sha256. Limits on what
      the inference establishes: the premise that the Cortex-A72 is Armv8-A (so no FEAT_RME) is left
      as a citation-pass TODO and the datasheet does not state it (it only refers to Cortex-A72 documentation),
      so the step "EL3 accesses are Secure" rests on that unstated premise plus the three declared
      assumptions (all-four-cores-enter-the-stub, cores-reach-the-stub-from-reset, interconnect-presents-secure-attribute-to-the-gic);
      the result is conditional on them, and PASS here does not perform the hardware TODO (read the
      group registers back at EL3).'
    contrary_evidence: none-found
    citation_precision: exact
  no-el3-runtime-with-the-stock-stub:
