- id: stub-build-must-match-peripheral-mode
  critical: true
  section: gotchas
  title: A stub build must match the peripheral mode
  claim: |-
    A stub built for one peripheral mode most likely programs the wrong addresses in the
    other, and high peripheral mode most likely needs a stub built for it. This rests on high
    peripheral mode being the full map, which the docs spec holds only as likely.
  support:
  - class: inference
    premises:
    - fact: '#high-peripheral-mode-needs-another-build'
      uses: each build hard-codes one map's bases, matching one of the datasheet's two maps
    - fact: '#documentation-says-high-peripheral-stub-support-is-missing'
    - fact: "bcm2711@hardware-specs-docs#high-peripheral-mode-is-full-map"
      uses: high peripheral mode is likely the one in which the Arm cores use the full-map addresses (held as likely, not established)
    derivation: each build hard-codes one map's bases; if high peripheral mode is the full map (a likely, not established, reading), the HIGH_PERI build matches it and the Low Peripheral build's bases are not the GIC and ARM_LOCAL blocks there, so in the other mode that build's GIC and ARM_LOCAL writes most likely miss those blocks
  todo:
    check: hardware
    text: |-
      boot
      with arm_peri_high=1 and no armstub= line, and record whether the stub's GIC writes land, by
      reading the GIC's group and control state with a debugger that makes secure accesses.
orientation: |-
  Adds to the `bcm2711` spec in `hardware-specs-docs` the facts that only the source of the
  Raspberry Pi Arm stub, `armstubs/armstub8.S` in raspberrypi/tools, states. Each `[src]` bullet
  says what that source does when built for BCM2711 (with `BCM2711` and `GIC` defined and
  `HIGH_PERI` not defined), citing the lines through the `rpi-tools` entry above. No document says
  the firmware's built-in stub is that build; the first bullet argues it, and every hardware
  consequence below rests on it.

  The facts here name symbols and constants from `armstubs/armstub8.S` in raspberrypi/tools at
  `439b6198a9b340de5998dd14a26a0d9d38a6bcac`, which carries the notice reproduced under Source
  notices.
