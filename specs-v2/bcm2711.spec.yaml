assumptions:
- id: stub-build-identity
  text: the firmware's built-in 64-bit stubs are built from `armstubs/armstub8.S`, which no document states
- id: all-four-cores-enter-the-stub
  text: the firmware starts all four cores at the stub's entry
- id: cores-reach-the-stub-from-reset
  text: the cores reach the stub from reset
- id: interconnect-presents-secure-attribute-to-the-gic
  text: the BCM2711 interconnect presents the Secure attribute of a Secure-state access to the GIC-400, which no document states
kind: overlay
facts:
- id: which-build-ships
  section: quick-facts
  title: Which build ships
  claim: |-
    For a 64-bit boot on the boards the `enable_gic` page names (it says
    Raspberry Pi 4B; this spec takes its wording to cover every BCM2711 board), the stub the firmware
    runs by default in Low Peripheral mode is most likely `armstub8.S` built with `BCM2711` and
    `GIC` defined; this is a candidate build, held with limited confidence, not an identified
    shipped revision.
  support:
  - class: inference
    premises:
    - states: the default stub is built into the firmware and chosen by model and settings
      support:
      - class: doc
        doc: rpi-docs-config-txt
        at:
        - heading: armstub
    - states: '`arm_64bit` defaults to 1 on Raspberry Pi 4, 400 and Compute Module 4 and 4S'
      support:
      - class: doc
        doc: rpi-docs-config-txt
        at:
        - heading: arm_64bit
    - states: the GIC-400 is the default interrupt controller
      support:
      - class: doc
        doc: rpi-docs-legacy-config-txt
        at:
        - heading: enable_gic
    - assumption: stub-build-identity
    - states: the firmware finds a magic value in the stub and writes the kernel and device-tree load addresses into it
      support:
      - class: doc
        doc: tfa-rpi4
        at:
        - heading: TF-A port design
    - states: this source carries the magic word and those two words, and its comment says the firmware clears the magic slot for reuse as a release slot
      support:
      - class: src
        anchors:
        - repo: rpi-tools
          path: armstubs/armstub8.S
          lines:
          - 190
          - 192
          symbol: spin_cpu3
    - states: its non-`HIGH_PERI` ARM Local base and GIC distributor and CPU-interface addresses are the datasheet's Low Peripheral ones
      support:
      - class: databook
        doc: bcm2711-peripherals
        at:
        - section: 6.5.1–6.5.2
          page: '92'
    - states: the distributor is at `+0x1000` and the CPU interface at `+0x2000` from the GIC base
      support:
      - class: databook
        doc: gic-400-trm
        at:
        - section: '3.2'
          table: 3-1
          page: 3-3
    derivation: '`arm_64bit` defaulting to 1 makes the default stub an AArch64 one; `BCM2711`, `GIC` and `HIGH_PERI` are the only conditionals in `armstub8.S`, so if the assumption holds the default is the `BCM2711` and `GIC` build'
  todo:
    check: hardware
    text: |-
      on a recorded board, configuration and firmware release, capture the whole stub
      image the firmware loads (through `setup_gic` past `0x100` and the trailing literals), and
      compare it with this build, excluding the words the firmware patches at `0xF0`–`0xFF`; or
      boot this build with `armstub=` and scope observations to it.

      citation-pass: v1 states without a citation that in `armstubs/` at the pin `armstub8.S` is the only AArch64 source, as `armstub.S` and `armstub7.S` are 32-bit. It is not yet a premise: it needs a search anchor over the `armstubs/` directory, and the `rpi-tools` files list (D12) has no entry for a directory, so adding one is a license-entry decision for a reader with the source.
- id: generic-timer-frequency
