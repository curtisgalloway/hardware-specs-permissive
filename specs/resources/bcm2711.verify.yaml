    note: 'Conditional inference read premise by premise. armstubs/armstub8.S at rpi-tools 439b6198:
      SCR_VAL (lines 59-66) is RW|HCE|SMD|RES1 bits 5,4|NS, so bit 7 (SMD) is set and bits 3,2,1 (EA,
