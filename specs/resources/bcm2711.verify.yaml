  the-group-settings-the-stub-wrote-are-secure-state:
    basis: 2611b50ae2b0c9b0327954129a20d64f32cefb1f62989c49181ce2ea35d07fb8
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session perm-p1
    note: 'GICv2 spec 4.3.4 p. 4-89 (GICD_IGROUPRn usage constraints): with the GIC Security Extensions
      the registers are Secure-access only and RAZ/WI to Non-secure accesses. GIC-400 TRM 1.1 p. 1-2:
      the GIC-400 implements the GIC Security Extensions. Together they give the claim. Condition:
      "a non-secure kernel cannot read back" assumes the kernel''s accesses reach the GIC marked Non-secure;
      this overlay declares the converse attribute question as assumption interconnect-presents-secure-attribute-to-the-gic
      but this fact does not reference it (a Secure EL1 could also make Secure accesses; with the
      stock stub none runs, so "at EL3 or from a debugger" is the practical set). Contrary search:
      rest of 4.3.4 and p. 4-90 (reset value; IMPLEMENTATION DEFINED reset-to-1 mechanism for Non-secure
      processors, which affects reset values, not read access); none.'
    contrary_evidence: none-found
    citation_precision: exact
