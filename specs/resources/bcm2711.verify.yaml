  scr-el3-bits:
    basis: c8c6c206a8c9c7149d401fd320e314df07a93b62866d9d6ffa4dbb9c8947dd52
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session perm-p1
    note: 'Source lines 59-66 define SCR_VAL as RW (bit 10), HCE (8), SMD (7), bits 5 and 4, NS (0);
      lines 121-123 move it to x0 and write SCR_EL3. Arm ARM M.d D24.2.168 (starts D24-9615): RW on
      D24-9638 (1 = next lower level AArch64; with EL2 enabled, EL2 is AArch64); HCE on D24-9639 (1
      = HVC enabled at EL3, EL2, EL1); SMD on D24-9639/9640 (1 = SMC UNDEFINED at EL1 and above; note
      on D24-9640 that an HCR_EL2.TSC trap of EL1 SMC to EL2 has priority over this disable); bits
      [5:4] RES1 on D24-9640; NS starts D24-9641, and for a PE without FEAT_RME (Cortex-A72) the "Otherwise"
      table on D24-9642 gives 1 = levels below EL3 are Non-secure. All derived consequences in the
      claim match. Contrary search: the other SCR_EL3 fields on D24-9636..9642 and the RW effective-value
      conditions; none narrow the claim. Precision: the NS locator cites D24-9641 only, but the non-RME
      NS meaning table is on D24-9642; widen to D24-9641-D24-9642.'
    contrary_evidence: none-found
    citation_precision: imprecise
  scr-el3-value:
    basis: 5186c44f2647509039c27923e8fbdfa1f73423a3709838fe29d6ff7518fd41d3
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session perm-p1
    note: 'Premise #scr-el3-bits (PASS in this reading) gives bits 10, 8, 7, 5, 4, 0. 0x400+0x100+0x80+0x20+0x10+0x1
      = 0x5B1, checked. The source writes SCR_VAL with a single mov immediate (line 122), and 0x5B1
      fits a 16-bit move immediate, so no other value is formed. The TODO (read SCR_EL3 with a debugger
      that can access EL3 state) can observe the value; it has not been performed and does not weaken
      the arithmetic. Contrary search: no other SCR_EL3 write in the file.'
    contrary_evidence: none-found
    citation_precision: exact
  entry-exception-level-and-state:
    basis: bf4ec785541519b34b502a94919627ee20e83d476ac9c4e486b687bdf1a0eb5f
    verdict: PASS
    date: '2026-10-14'
    verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session perm-p1
    note: 'Source lines 74-80: SPSR value sets D, A, I, F (bits 9-6) and mode 9, named EL2H; Arm ARM
      M.d encodes M[3:0]=0b1001 as "EL2 with SP_EL2 (EL2h)" (seen in a D24.3 debug PSR table, page
      D24-10220), so "using SP_EL2" holds. Lines 136-141 write 0x30C50830 to SCTLR_EL2 under a comment
      that the set bits are RES1, little-endian, no WXN/I/SA/C/A/M; the claim''s paraphrase (MMU,
      caches, alignment checks off) matches the comment (bit 25 EE and bit 0 M are clear in the value).
      Lines 143-148 write SPSR_EL3, ELR_EL3 and eret. Lines 163-171: primary core loads kernel_entry32
      to x4 and dtb_ptr32 to w0, zeroes x1-x3 and branches to x4. booting.rst section "4. Call the
      kernel image" requires x0 = DTB physical address, x1-x3 = 0, DAIF masked, non-secure EL2 or
      EL1, MMU off: the stub''s state matches (NS set in SCR_EL3 per scr-el3-bits). Contrary search:
      whole of booting.rst section 4 (timers, coherency, system-register requirements are not part
      of this claim) and the stub''s secondary path (not covered by the claim''s "primary core" sentence);
      nothing contradicts. Precision: the heading locator omits the "4." in "4. Call the kernel image",
      and "using SP_EL2" has no cited architecture support (add an Arm ARM locator for the SPSR_EL3
      M[3:0] encoding, or say "the mode the source names EL2H").'
    contrary_evidence: none-found
    citation_precision: imprecise
    readers:
    - verifier: Claude Code subagent, claude-opus-5-5, Claude Code, session pg-r2
      verdict: PASS
      date: '2026-10-14'
      note: 'spec.py resolve: 32 anchors resolved, 0 skipped. armstub8.S at the pin: lines 74-80 define
        the EL3 SPSR value as D, A, I, F set with mode 9 (EL2h, i.e. EL2 using SP_EL2); lines 136-141
        load 0x30c50830 into SCTLR_EL2 with a comment saying all set bits are RES1 and LE with WXN/I/SA/C/A/M
        clear (the claim''s paraphrase drops WXN, which is an omission not an error); I independently
        decoded 0x30C50830 as bits 4,5,11,16,18,22,23,28,29, the SCTLR_EL2 RES1 set for the non-VHE
        layout, consistent with the comment. Lines 143-148 write SPSR_EL3 and ELR_EL3 and eret. Lines
        163-171: primary loads w4 from kernel_entry32 and w0 from dtb_ptr32, zeroes x1-x3, branches
        to x4. booting.rst section "4. Call the kernel image", "Primary CPU general-purpose register
        settings" (x0 = dtb physical address, x1-x3 = 0) matches; the same section also requires DAIF
        masked, EL2 or EL1 non-secure, MMU off, which the stub state is consistent with. Contrary
        search: Makefile build variants (-DGIC, -DHIGH_PERI, -DBCM2711) change only the GIC setup
        call and peripheral addresses, not the SPSR/SCTLR/register hand-off; the secondary path also
        zeroes x1-x3 but sets x0=0, and the claim is scoped to the primary core. The claim describes
        what the stub source does (src class), not which binary the firmware runs; the overlay''s
        stub-build-identity assumption is not declared on this fact, which is acceptable for a code-describing
        claim. Citation: the standard locator heading "Call the kernel image" omits the "4. " that
        is part of the rendered heading text at the pin (the docs root cites "4. Call the kernel image");
        it identifies the section unambiguously, so graded imprecise rather than nonexistent. Suggest
        changing it to "4. Call the kernel image" and adding a clause locator for the register-settings
        paragraph.'
