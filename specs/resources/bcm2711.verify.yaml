      (the file never writes VBAR_EL3 or MDCR_EL3, and its only eret) are anchored to lines 91-148
      only, while setup_gic follows from line 210; the absence over the whole file needs a search
      anchor (VBAR_EL3, MDCR_EL3, eret) or an extended range. Contrary evidence search: the whole
      stub file, the SCR_EL3 EA/FIQ/IRQ/SMD fields, the SMC rule in the Arm ARM and the Linux enable-method
      text; nothing contradicting found.'
